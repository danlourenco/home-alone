<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: a single long-read column (~42rem) on snow-white paper; figures break out wider; a surveyor's scale bar under the title */
:root {
  --paper:#f5f7f9; --ink:#15202e; --muted:#566273; --rule:#d5dbe2; --red:#b01e2b; --teal:#0b6f78; --code:#e9edf1;
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#11161d; --ink:#e7ebf0; --muted:#9aa6b4; --rule:#2a333e; --red:#ef5b62; --teal:#4fc2c9; --code:#1a212a; color-scheme:dark } }
:root[data-theme="dark"] { --paper:#11161d; --ink:#e7ebf0; --muted:#9aa6b4; --rule:#2a333e; --red:#ef5b62; --teal:#4fc2c9; --code:#1a212a; color-scheme:dark }
body { background:var(--paper); color:var(--ink); font:1.0625rem/1.7 var(--serif); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:40px 80px }
main { max-width:64rem; margin:0 auto }
article { max-width:42rem; margin:0 auto; display:flow-root }
header { max-width:42rem; margin:0 auto 40px }
.eyebrow { font:500 .75rem var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--red) }
h1 { font:800 clamp(2.4rem, 7vw, 4rem)/1.0 var(--display); letter-spacing:-.025em; margin:12px 0 16px; text-wrap:balance }
.sub { font:400 1.25rem/1.5 var(--serif); font-style:italic; color:var(--muted); margin:0; text-wrap:balance }
.scale { margin-top:24px; display:grid; grid-template-columns:repeat(5, 1fr); max-width:20rem; font:400 .7rem var(--mono); color:var(--muted) }
.scale span { border-top:6px solid var(--ink); padding-top:4px }
.scale span:nth-child(even) { border-top-color:var(--rule) }
h2 { font:800 1.75rem/1.15 var(--display); letter-spacing:-.015em; margin:56px 0 12px; text-wrap:balance }
h3 { font:500 1.2rem/1.3 var(--display); margin:36px 0 8px; color:var(--teal) }
p, ul, ol { margin:0 0 18px }
li { margin-bottom:6px }
a { color:var(--teal) }
strong { font-weight:600 }
hr { border:0; border-top:1px solid var(--rule); margin:40px 0 }
code { font:400 .86em var(--mono); background:var(--code); padding:1px 5px; border-radius:3px; overflow-wrap:anywhere }
pre { background:var(--code); padding:14px 16px; border-radius:4px; overflow-x:auto; font:400 .82rem/1.5 var(--mono) }
pre code { background:none; padding:0 }
pre.mermaid { background:transparent; text-align:center; margin:28px 0 }
blockquote { margin:28px 0; padding:0 0 0 20px; border-left:3px solid var(--red); font:400 1.3rem/1.45 var(--serif); font-style:italic; color:var(--ink) }
blockquote p { margin:0 }
figure { margin:32px 0; display:grid; gap:8px }
@media (min-width: 60rem) { figure { margin-inline:-8rem } }
figure img { width:100%; height:auto; border:1px solid var(--rule); border-radius:3px; background:var(--code) }
figcaption { font:400 .8rem/1.5 var(--mono); color:var(--muted); max-width:42rem; justify-self:center; text-align:left }
.tw { overflow-x:auto; margin:24px 0 }
table { border-collapse:collapse; font:400 .86rem/1.45 var(--serif); width:100% }
th { font:500 .72rem var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); text-align:left; border-bottom:2px solid var(--ink); padding:8px 12px 8px 0 }
td { border-bottom:1px solid var(--rule); padding:10px 12px 10px 0; vertical-align:top; min-width:9rem }
</style>

<header>
<div class="eyebrow">Show and tell · Winnetka, Illinois · 1:1 scale</div>
<h1>{{TITLE}}</h1>
<p class="sub">{{SUB}}</p>
<div class="scale" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4 m</span></div>
</header>
