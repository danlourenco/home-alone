<style>
/* hero: a pinned stage (100svh) inside a tall scroll track; progress 0..1 drives five beats */
:root { --hero-hi:#ffffff; --hero-lo:#dde3ea; --glow:#0b6f78 }

.hero-cap p { margin:4px 0 0; font:400 .95rem/1.45 var(--serif); color:var(--ink) }
.hero-cap p.aside { font-size:.85rem; color:var(--muted); font-style:italic }
.hero-ctl { position:absolute; left:max(16px, env(safe-area-inset-left, 0px)); right:max(16px, env(safe-area-inset-right, 0px)); bottom:24px; display:flex; gap:12px; align-items:center }
.hero-ctl button { font:500 .75rem var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--paper); background:var(--ink); border:0; border-radius:3px; padding:9px 14px; cursor:pointer; min-width:5.5rem }

.hero-noscript { position:absolute; inset:auto 16px 50% 16px; text-align:center; color:var(--muted) }
/* time strip */
.strip { max-width:64rem; margin:0 auto 48px }
article .strip { margin-inline:0 }
@media (min-width: 60rem) { article .strip { margin-inline:-8rem } }
.strip-track { display:grid; grid-auto-flow:column; grid-auto-columns:min(78%, 17rem); gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 2px 12px; overscroll-behavior-x:contain }

.strip-track figure.on { opacity:1 }
.strip-track img { width:100%; aspect-ratio:4/3; object-fit:cover; border:1px solid var(--rule); border-radius:3px; background:var(--code) }
.strip-track .when { font:500 .72rem var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--red) }
.strip-cap { font:400 .9rem/1.5 var(--serif); color:var(--ink); min-height:3em; margin:4px 0 0; max-width:42rem }

    <div class="hero-cap" id="hero-cap" aria-live="polite"><div class="n" id="hero-n"></div><p id="hero-text"></p><p class="aside" id="hero-aside"></p></div>

  </div>
</section>

  const out = p > 0.505 && p < 0.545, blink = out && Math.floor((p - 0.505) / 0.008) % 2 === 0;

}

// ---- progress: the page's scroll through the hero is the one source of truth; play scrolls the page
const scrub = document.getElementById('hero-scrub'), play = document.getElementById('hero-play');
const span = () => hero.offsetHeight - innerHeight, top0 = () => hero.getBoundingClientRect().top + scrollY;
const scrollP = () => clamp((scrollY - top0()) / span());
function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; }
addEventListener('resize', resize); resize();
let playing = false, playT0 = 0, playP0 = 0, raf = 0, t0 = performance.now();
const PLAY_S = 24;
function setPlaying(on) { playing = on; play.textContent = on ? 'Pause' : 'Play'; play.setAttribute('aria-pressed', on); if (on) { playP0 = scrollP() >= 0.999 ? 0 : scrollP(); playT0 = performance.now(); } }
play.addEventListener('click', () => setPlaying(!playing));
['wheel', 'touchstart', 'keydown'].forEach(e => addEventListener(e, ev => { if (playing && ev.target !== play) setPlaying(false); }, { passive: true }));
scrub.addEventListener('input', () => { setPlaying(false); scrollTo({ top: top0() + span() * scrub.value / 1000, behavior: 'instant' }); });
function frame(now) {
  raf = requestAnimationFrame(frame);
  if (playing) {
    let p = playP0 + (now - playT0) / 1000 / PLAY_S;
    if (REDUCED) {   // no glide: hold each beat's finished state for 3.5 s
      const stops = BEATS.map(b => b.b - 0.01).concat([1]), i0 = stops.findIndex(s => s > playP0 + 1e-3);
      p = stops[Math.min(stops.length - 1, i0 + Math.floor((now - playT0) / 3500))];
    }
    if (p >= 1) { p = 1; setPlaying(false); }
    scrollTo({ top: top0() + span() * p, behavior: 'instant' });
  }
  const p = scrollP(); scrub.value = Math.round(p * 1000);
  const r = hero.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;   // offscreen: skip the draw
  render(p, REDUCED ? 0 : (now - t0) / 1000);
}
if (FIXED !== null) { render(FIXED, 0); scrub.value = FIXED * 1000; }
else if (FILMMODE) { window.heroStep = (p, t = 0) => render(p, t); render(0, 0); }
else raf = requestAnimationFrame(frame);
window.heroSet = p => render(p, 0);
window.heroNDC = (x, y, z) => new THREE.Vector3(x, y, z).project(cam).toArray();   // checks: where a point lands on screen
</script>
<script>
// time strip: the card nearest the middle is "on" and its caption shows; film slider: a range input drives the divider
addEventListener('DOMContentLoaded', () => {
  const tr = document.querySelector('.strip-track'), cap = document.querySelector('.strip-cap');
  if (tr) {
    const figs = [...tr.querySelectorAll('figure')];
    const upd = () => { const m = tr.scrollLeft + tr.clientWidth / 2; let best = figs[0], d = 1e9;
      for (const f of figs) { const c = f.offsetLeft - tr.offsetLeft + f.offsetWidth / 2, e = Math.abs(c - m); if (e < d) { d = e; best = f; } }
      figs.forEach(f => f.classList.toggle('on', f === best)); cap.textContent = best.dataset.when + ': ' + best.dataset.cap; };
    tr.addEventListener('scroll', () => requestAnimationFrame(upd), { passive: true }); upd();
    let drag = null;   // mouse drag to scroll (touch and trackpads scroll natively)
    tr.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') { drag = { x: e.clientX, s: tr.scrollLeft }; tr.style.scrollSnapType = 'none'; } });
    addEventListener('pointermove', e => { if (drag) tr.scrollLeft = drag.s - (e.clientX - drag.x); });
    addEventListener('pointerup', () => { if (drag) { drag = null; tr.style.scrollSnapType = ''; } });
  }
  for (const fig of document.querySelectorAll('.slider-fig')) {
    const sl = fig.querySelector('.slider'), rng = sl.querySelector('input'), note = fig.querySelector('figcaption'), tabs = [...fig.querySelectorAll('.slider-tabs button')];
    const set = () => { sl.style.setProperty('--x', rng.value / 10 + '%'); rng.setAttribute('aria-valuetext', `${Math.round(rng.value / 10)}% ours, ${100 - Math.round(rng.value / 10)}% film`); };
    rng.addEventListener('input', set); set();
    tabs.forEach(b => b.addEventListener('click', () => {
      tabs.forEach(x => x.setAttribute('aria-pressed', x === b));
      sl.querySelectorAll('img').forEach(im => im.hidden = im.dataset.k !== b.dataset.k); note.textContent = b.dataset.note; }));
  }
});
</script>
